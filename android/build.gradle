buildscript {
    ext.kotlin_version = '2.2.20'
    ext.google_play_services_version = '4.4.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        // START: FlutterFire Configuration
        classpath 'com.google.gms:google-services:4.4.0'
        // END: FlutterFire Configuration
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Avoid build failures when dependencies add -Werror; also suppress obsolete
// source/target option warnings from Java 8 bytecode on newer toolchains.
subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.removeAll(["-Werror"])
        options.compilerArgs += ["-Xlint:-options"]
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
