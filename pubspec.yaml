name: jetmarket
version: 2.2.0
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.2
  get: 4.6.6
  flutter:
    sdk: flutter
  dio: ^5.3.4
  flutter_screenutil: ^5.9.0
  dotted_border: ^2.1.0
  permission_handler: ^11.0.1
  flutter_dotenv: ^5.1.0
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1
  get_storage: ^2.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  device_preview: ^1.1.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_svg: ^2.0.9
  gap: ^3.0.1
  carousel_slider: ^5.0.0
  flutter_staggered_grid_view: ^0.7.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  google_maps_flutter: ^2.5.0
  image_picker: ^1.0.4
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  syncfusion_flutter_barcodes: ^24.2.4
  awesome_dialog: ^3.1.0
  url_launcher: ^6.2.1
  calendar_date_picker2: ^0.5.3
  infinite_scroll_pagination: ^4.0.0
  easy_image_viewer: ^1.3.2
  flutter_widget_from_html: ^0.16.1
  pull_to_refresh: ^2.0.0
  cloud_firestore: ^5.4.0
  scrollable_positioned_list: ^0.3.8
  scroll_to_index: ^3.0.1
  rxdart: ^0.27.7
  app_links: ^6.3.2
  share_plus: ^7.2.2
  firebase_analytics: ^11.3.0
  dropdown_button2: ^2.3.9
  flutter_native_splash: ^2.3.10
  pdf: ^3.11.1
  fluttertoast: ^8.2.10
  path_provider: ^2.1.0
  package_info_plus: ^8.0.0
  flutter_pdfview: ^1.4.0
  photo_view: ^0.15.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  screenshot: ^3.0.0
  image_gallery_saver_plus: ^3.0.4
  # Google Maps and Places APIs
  flutter_polyline_points: ^2.0.0
  google_places_sdk: ^1.2.1
  logger: ^2.6.2
  webview_flutter: ^4.4.4

flutter_native_splash:
  background_image: assets/images/splash.png
  android: true
  ios: true

dev_dependencies:
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/svg/
    - assets/images/
    - assets/env/
    - assets/json/
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/launcher.png"
  android_adaptive_icon_background: "assets/launcher.png"
  android_adaptive_icon_foreground: "assets/launcher.png"
